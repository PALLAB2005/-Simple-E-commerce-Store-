<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | NexCart</title><link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-login">
<main class="auth-page"><form id="adminLoginForm" class="auth-card">
  <a class="logo" href="/">NexCart</a><h1>Admin sign in</h1><p>Manage the store from one secure workspace.</p>
  <label>Email</label><input name="email" type="email" required>
  <label>Password</label><input name="password" type="password" required>
  <button class="btn primary" type="submit">Sign in</button><p id="message" class="message"></p>
</form></main>
<script src="/admin/js/admin-login.js"></script>
</body>
</html>
