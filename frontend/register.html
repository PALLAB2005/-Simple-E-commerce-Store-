<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | NexCart</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="navbar">
  <a class="logo" href="/">NexCart</a>
  <nav><a href="/">Home</a><a href="/cart.html">Cart <span id="cartCount" class="badge">0</span></a></nav>
</header>

<main class="auth-page">
  <form id="registerForm" class="auth-card">
    <h1>Create Account</h1>
    <p>Register to place orders.</p>
    <label>Full Name</label>
    <input name="name" type="text" minlength="2" required>
    <label>Email</label>
    <input name="email" type="email" required>
    <label>Password</label>
    <input name="password" type="password" minlength="6" required>
    <button class="btn primary" type="submit">Register</button>
    <p id="message" class="message"></p>
    <p>Already registered? <a href="/login.html">Login</a></p>
  </form>
</main>

<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
